<title>Online School Tool Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#4f46e5;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-top:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

h2{
    margin-bottom:15px;
}

/* 🆕 購物車頂端紅點數字的樣式 */
.badge {
    background: #ef4444;
    color: white;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 14px;
    margin-left: 5px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.product{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.product img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.product-info{
    padding:15px;
}

.product-info h3{
    margin-bottom:10px;
}

.price{
    color:#4f46e5;
    font-weight:bold;
}

input,textarea,select{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    background:#4f46e5;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

/* 🆕 購物車內部項目的左右排版與按鈕樣式 */
.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px dashed #ddd;
}

.counter-btn {
    background: #e0e7ff;
    color: #4f46e5;
    padding: 2px 8px;
    font-size: 14px;
    border-radius: 4px;
    margin: 0 5px;
    font-weight: bold;
}
.counter-btn:hover {
    background: #c7d2fe;
}

.auth-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.order-item{
    border-bottom:1px solid #ddd;
    padding:10px 0;
}

#userInfo{
    margin-top:10px;
    font-weight:bold;
}

@media(max-width:768px){
    .auth-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 Online School Supply Store</h1>
    <div id="userInfo">Not Logged In</div>
</header>

<div class="container">

    <div class="card">
    <h2>School Supplies</h2>

    <div class="products">

        <div class="product">
            <img src="highlighter.jpg">
            <div class="product-info">
                <h3>Highlighter</h3>
                <p class="price">NT$15</p>
                <button onclick="addToCart('Highlighter',15)">
                    Add To Cart
                </button>
            </div>
        </div>

        <div class="product">
            <img src="images/correction tape.jpg">
            <div class="product-info">
                <h3>Correction Tape</h3>
                <p class="price">NT$20</p>
                <button onclick="addToCart('Correction Tape',20)">
                    Add To Cart
                </button>
            </div>
        </div>

        <div class="product">
            <img src="eraser.jpg">
            <div class="product-info">
                <h3>Eraser</h3>
                <p class="price">NT$12</p>
                <button onclick="addToCart('Eraser',12)">
                    Add To Cart
                </button>
            </div>
        </div>

    </div>
</div>

<div class="card">
    <h2>🛒 Shopping Cart <span id="cartCounter" class="badge">0</span></h2>

    <div id="cartItems">
        Your cart is empty.
    </div>

    <h3 id="cartTotal">
        Total: NT$0
    </h3>
</div>

<div class="card">
    <h2>Checkout</h2>

    <input id="checkoutName" placeholder="Full Name">
    <input id="checkoutEmail" type="email" placeholder="Email Address">

    <button onclick="checkout()">
        Submit Order
    </button>
</div>

    <div class="card">
        <h2>Account</h2>

        <div class="auth-grid">

            <div>
                <h3>Sign Up</h3>

                <input type="email" id="signupEmail" placeholder="Email">
                <input type="password" id="signupPassword" placeholder="Password">

                <button onclick="signUp()">Sign Up</button>
            </div>

            <div>
                <h3>Login</h3>

                <input type="email" id="loginEmail" placeholder="Email">
                <input type="password" id="loginPassword" placeholder="Password">

                <button onclick="login()">Login</button>
            </div>

        </div>

        <br>
        <button onclick="logout()">Logout</button>
    </div>

    <div class="card">
        <h2>My Order History</h2>

        <div id="orderHistory">
            Login to view orders.
        </div>
    </div>

</div>

// 【🆕 2. 升級 updateCart 函式，同時渲染「購物車內容」、「總價」與「Counter加減鍵」】
window.updateCart = function() {
    const cartItemsDiv = document.getElementById("cartItems");
    const cartTotalH3 = document.getElementById("cartTotal");
    const cartCounterSpan = document.getElementById("cartCounter");
    
    if (cart.length === 0) {
        cartItemsDiv.innerHTML = "Your cart is empty.";
        cartTotalH3.innerText = "Total: NT$0";
        cartCounterSpan.innerText = "0"; // 沒東西時顯示 0
        return;
    }
    
    let html = "";
    let total = 0;
    let totalItems = 0; // 用來計算總件數
    
    cart.forEach((item, index) => {
        html += `
        <div class="cart-item">
            <span>${item.name} (NT$${item.price})</span>
            <div>
                <button class="counter-btn" onclick="changeQuantity(${index}, -1)">-</button>
                <span>${item.quantity}</span>
                <button class="counter-btn" onclick="changeQuantity(${index}, 1)">+</button>
                <span style="margin-left: 15px; font-weight: bold;">NT$${item.price * item.quantity}</span>
            </div>
        </div>`;
        total += item.price * item.quantity;
        totalItems += item.quantity; // 累加數量
    });
    
    cartItemsDiv.innerHTML = html;
    cartTotalH3.innerText = `Total: NT$${total}`;
    cartCounterSpan.innerText = totalItems; // 更新紅點數字
}

// 【🆕 3. 新增變更數量的處理函式】
window.changeQuantity = function(index, amount) {
    cart[index].quantity += amount;
    // 當數量減到 0 或以下，就把該商品從購物車陣列移出
    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }
    updateCart();
}
