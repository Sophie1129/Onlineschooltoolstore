# Onlineschooltoolstore

<!DOCTYPE html>

<html lang="en">

<head>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online School Tool Store</title>



<style>

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

    font-family:Arial, sans-serif;

}



body{

    background:#f4f6f9;

}



header{

    background:#4f46e5;

    color:white;

    padding:20px;

    text-align:center;

}



.container{

    width:90%;

    max-width:1200px;

    margin:auto;

    padding:20px;

}



.card{

    background:white;

    padding:20px;

    margin-top:20px;

    border-radius:12px;

    box-shadow:0 2px 8px rgba(0,0,0,.1);

}



h2{

    margin-bottom:15px;

}



.products{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

    gap:20px;

}



.product{

    background:white;

    border-radius:12px;

    overflow:hidden;

    box-shadow:0 2px 8px rgba(0,0,0,.1);

}



.product img{

    width:100%;

    height:220px;

    object-fit:cover;

}



.product-info{

    padding:15px;

}



.product-info h3{

    margin-bottom:10px;

}



.price{

    color:#4f46e5;

    font-weight:bold;

}



input,textarea,select{

    width:100%;

    padding:10px;

    margin-top:8px;

    margin-bottom:12px;

    border:1px solid #ccc;

    border-radius:8px;

}



button{

    background:#4f46e5;

    color:white;

    border:none;

    padding:10px 18px;

    border-radius:8px;

    cursor:pointer;

}



button:hover{

    opacity:.9;

}



.auth-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

}



.order-item{

    border-bottom:1px solid #ddd;

    padding:10px 0;

}



#userInfo{

    margin-top:10px;

    font-weight:bold;

}



@media(max-width:768px){

    .auth-grid{

        grid-template-columns:1fr;

    }

}

</style>

</head>



<body>



<header>

    <h1>📚 Online School Supply Store</h1>

    <div id="userInfo">Not Logged In</div>

</header>



<div class="container">



    <div class="card">

    <h2>School Supplies</h2>



    <div class="products">



        <div class="product">

            <img src="highlighter.jpg">

            <div class="product-info">

                <h3>Highlighter</h3>

                <p class="price">NT$15</p>

                <button onclick="addToCart('Highlighter',15)">

                    Add To Cart

                </button>

            </div>

        </div>



        <div class="product">

            <img src="images/correction tape.jpg">

            <div class="product-info">

                <h3>Correction Tape</h3>

                <p class="price">NT$20</p>

                <button onclick="addToCart('Correction Tape',20)">

                    Add To Cart

                </button>

            </div>

        </div>



        <div class="product">

            <img src="eraser.jpg">

            <div class="product-info">

                <h3>Eraser</h3>

                <p class="price">NT$12</p>

                <button onclick="addToCart('Eraser',12)">

                    Add To Cart

                </button>

            </div>

        </div>



    </div>

</div>

<div class="card">



    <h2>🛒 Shopping Cart</h2>



    <div id="cartItems">

        Your cart is empty.

    </div>



    <h3 id="cartTotal">

        Total: NT$0

    </h3>



</div>

    <div class="card">



    <h2>Checkout</h2>



    <input id="checkoutName" placeholder="Full Name">

    <input id="checkoutEmail" type="email" placeholder="Email Address">



    <button onclick="checkout()">

        Submit Order

    </button>



</div>

    <div class="card">

        <h2>Account</h2>



        <div class="auth-grid">



            <div>

                <h3>Sign Up</h3>



                <input type="email" id="signupEmail" placeholder="Email">

                <input type="password" id="signupPassword" placeholder="Password">



                <button onclick="signUp()">Sign Up</button>

            </div>



            <div>

                <h3>Login</h3>



                <input type="email" id="loginEmail" placeholder="Email">

                <input type="password" id="loginPassword" placeholder="Password">



                <button onclick="login()">Login</button>

            </div>



        </div>



        <br>

        <button onclick="logout()">Logout</button>

    </div>



    <div class="card">

        <h2>My Order History</h2>



        <div id="orderHistory">

            Login to view orders.

        </div>

    </div>



</div>



<script type="module">



import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

  getAuth,

  createUserWithEmailAndPassword,

  signInWithEmailAndPassword,

  signOut,

  onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



import {

  getFirestore,

  collection,

  addDoc,

  query,

  where,

  orderBy,

  getDocs,

  serverTimestamp

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";





// Firebase Config

const firebaseConfig = {

  apiKey: "AIzaSyCJzCCtXqUocp3tJ8UA_5w-KRT4gknBvYA",

  authDomain: "onlinestore-c2dd9.firebaseapp.com",

  projectId: "onlinestore-c2dd9",

  storageBucket: "onlinestore-c2dd9.firebasestorage.app",

  messagingSenderId: "718751590576",

  appId: "1:718751590576:web:fc401df926d47f9760b375",

  measurementId: "G-DHDVQMRMNN"

};



// Firebase Initialize

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);





// EmailJS Config

const EMAILJS_PUBLIC_KEY = "idz2AOO5O0lVowKHc";

const EMAILJS_SERVICE_ID = "service_iayn6dg";

const EMAILJS_TEMPLATE_ID = "template_dobxi6s";





// Initialize EmailJS

emailjs.init({

  publicKey: EMAILJS_PUBLIC_KEY

});



let currentUser = null;

let cart = [];



// 【修正：補上 updateCart 函式，用於渲染購物車畫面】

window.updateCart = function() {

    const cartItemsDiv = document.getElementById("cartItems");

    const cartTotalH3 = document.getElementById("cartTotal");

    

    if (cart.length === 0) {

        cartItemsDiv.innerHTML = "Your cart is empty.";

        cartTotalH3.innerText = "Total: NT$0";

        return;

    }

    

    let html = "";

    let total = 0;

    

    cart.forEach(item => {

        html += `<div>${item.name} x${item.quantity} - NT$${item.price * item.quantity}</div>`;

        total += item.price * item.quantity;

    });

    

    cartItemsDiv.innerHTML = html;

    cartTotalH3.innerText = `Total: NT$${total}`;

}



window.addToCart = function(name, price){



    const existing = cart.find(item => item.name === name);



    if(existing){

        existing.quantity++;

    }else{

        cart.push({

            name,

            price,

            quantity:1

        });

    }



    updateCart();

}



// ==========================

// Sign Up

// ==========================

window.signUp = async () => {

    const email = document.getElementById("signupEmail").value;

    const password = document.getElementById("signupPassword").value;



    try{

        await createUserWithEmailAndPassword(auth, email, password);

        alert("Signup successful");

    }catch(error){

        alert(error.message);

    }

};





// ==========================

// Login

// ==========================

window.login = async () => {

    const email = document.getElementById("loginEmail").value;

    const password = document.getElementById("loginPassword").value;



    try{

        await signInWithEmailAndPassword(auth, email, password);

        alert("Login successful");

    }catch(error){

        alert(error.message);

    }

};





// ==========================

// Logout

// ==========================

window.logout = async () => {

    await signOut(auth);

};





// ==========================

// Place Order

// ==========================

window.checkout = async function(){



    if(!currentUser){

        alert("Please login first.");

        return;

    }



    if(cart.length===0){

        alert("Cart is empty.");

        return;

    }



    const customerName = document.getElementById("checkoutName").value;

    const customerEmail = document.getElementById("checkoutEmail").value;



    if(!customerName || !customerEmail) {

        alert("Please fill in name and email for checkout.");

        return;

    }



    let total = 0;

    cart.forEach(item=>{

        total += item.price * item.quantity;

    });



    try{

        await addDoc(

            collection(db,"orders"),

            {

                userId: currentUser.uid,

                userEmail: currentUser.email,

                customerName,

                customerEmail,

                items: cart,

                total,

                status:"Pending",

                orderDate: serverTimestamp()

            }

        );



        const itemList = cart.map(item=>

            `${item.name} x${item.quantity}`

        ).join(", ");



        await emailjs.send(

            EMAILJS_SERVICE_ID,

            EMAILJS_TEMPLATE_ID,

            {

                customer_name: customerName,

                customer_email: customerEmail,

                items: itemList,

                total: total

            }

        );



        alert("Order submitted successfully!");

        cart = [];

        updateCart();

        loadOrders();



        // 清空輸入框

        document.getElementById("checkoutName").value = "";

        document.getElementById("checkoutEmail").value = "";



    }catch(error){

        console.error(error);

        alert("Order failed. " + error.message);

    }

}



// ==========================

// Load Orders

// ==========================

async function loadOrders(){



    if(!currentUser){

        document.getElementById("orderHistory").innerHTML = "Login to view orders.";

        return;

    }



    try {

        const q = query(

            collection(db,"orders"),

            where("userId","==",currentUser.uid),

            orderBy("orderDate","desc")

        );



        const snapshot = await getDocs(q);

        let html = "";



        snapshot.forEach(doc=>{

            const o = doc.data();



            // 【修正：o.items 的字串模版補上 $，並移除原始程式中不存在的欄位 o.message、o.price 等】

            const itemDetails = (o.items || [])

                .map(item => `${item.name} x${item.quantity} (NT$${item.price})`)

                .join("<br>");



            html += `

            <div class="order-item">

                <strong>Items:</strong><br>${itemDetails}<br>

                <strong>Customer Name:</strong> ${o.customerName || 'N/A'}<br>

                <strong>Customer Email:</strong> ${o.customerEmail || 'N/A'}<br>

                <strong>Total Amount:</strong> NT$${o.total}<br>

                <strong>Status:</strong> ${o.status || 'Pending'}<br>

                <strong>Account Email:</strong> ${o.userEmail}

            </div>

            `;

        });



        if(html===""){

            html="No orders found.";

        }



        document.getElementById("orderHistory").innerHTML = html;

    } catch (error) {

        console.error("Error loading orders:", error);

        // 如果噴出 Index 錯誤，Console 會顯示一條建立 Firebase Index 的專屬連結

        document.getElementById("orderHistory").innerHTML = "Error loading orders. Check console for index requirements.";

    }

}





// ==========================

// Auth Listener

// ==========================

onAuthStateChanged(auth,(user)=>{



    currentUser = user;



    if(user){

        document.getElementById("userInfo").innerText = `Logged in as: ${user.email}`;

        loadOrders();

    }else{

        document.getElementById("userInfo").innerText = "Not Logged In";

        document.getElementById("orderHistory").innerHTML = "Login to view orders.";

    }



});



</script>



</body>

</html>
