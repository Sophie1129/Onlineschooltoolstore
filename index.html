<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online School Tool Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body{
    background:#f0f4f8;
}

header{
    background:#1e293b;
    color:#f1f5f9;
    padding:20px;
    text-align:center;
    border-bottom: 3px solid #38bdf8;
}

.container{
    width:95%;
    max-width:1200px;
    margin:auto;
    padding:20px;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 20px;
    align-items: start;
}

.left-column {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.right-column {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(30,41,59,.05);
    border: 1px solid #e2e8f0;
}

h2{
    margin-bottom:15px;
    color: #0f172a;
    font-size: 1.3rem;
    border-left: 4px solid #0284c7;
    padding-left: 10px;
}

/* 🆕 搜尋框專屬樣式 */
.search-box {
    margin-bottom: 20px;
    position: relative;
}
.search-box input {
    padding-left: 35px; /* 留位置給未來的圖示或純文字說明 */
    margin-top: 0;
    margin-bottom: 0;
}

.badge {
    background: #0ea5e9;
    color: white;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 14px;
    margin-left: 5px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
}

.product{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.04);
    border: 1px solid #e2e8f0;
    cursor: pointer;
    transition: all 0.3s ease; /* 讓放大與發光特效變平滑 */
}

/* 🆕 點擊商品被凸顯時的特效樣式 (外框變粗、發光藍影、微放大) */
.product.highlighted {
    border: 3px solid #0284c7;
    box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
    transform: scale(1.03);
}

.product img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.product-info{
    padding:15px;
}

.product-info h3{
    margin-bottom:10px;
    color: #334155;
    font-size: 1.1rem;
}

.price{
    color:#0284c7;
    font-weight:bold;
    margin-bottom: 10px;
}

input,textarea,select{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    background: #f8fafc;
}
input:focus {
    outline: none;
    border-color: #38bdf8;
    background: white;
}

button{
    background:#0284c7;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight: 500;
    transition: background 0.2s;
}

button:hover{
    background:#0369a1;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px dashed #cbd5e1;
    color: #334155;
}

.counter-btn {
    background: #e0f2fe;
    color: #0369a1;
    padding: 2px 8px;
    font-size: 14px;
    border-radius: 4px;
    margin: 0 5px;
    font-weight: bold;
}
.counter-btn:hover {
    background: #bae6fd;
}

.auth-vertical{
    display:flex;
    flex-direction: column;
    gap:15px;
}
.auth-box {
    padding-top: 10px;
    border-top: 1px solid #f1f5f9;
}
.auth-box h3 {
    font-size: 1rem;
    color: #475569;
    margin-bottom: 5px;
}

.order-item{
    border-bottom:1px solid #e2e8f0;
    padding:12px 0;
    font-size: 0.9rem;
    color: #334155;
    line-height: 1.5;
}

#userInfo{
    margin-top:10px;
    font-weight:bold;
    color: #94a3b8;
}

@media(max-width:900px){
    .container{
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 Online School Supply Store</h1>
    <div id="userInfo">Not Logged In</div>
</header>

<div class="container">

    <div class="left-column">
        
        <div class="card">
            <h2>School Supplies</h2>
            
            <div class="search-box">
                <input id="searchInput" placeholder="🔍 Search products by name..." oninput="filterProducts()">
            </div>

            <div class="products" id="productList">
                <div class="product" onclick="toggleHighlight(this)">
                    <img src="highlighter.jpg">
                    <div class="product-info">
                        <h3>Highlighter</h3>
                        <p class="price">NT$15</p>
                        <button onclick="event.stopPropagation(); addToCart('Highlighter',15)">Add To Cart</button>
                    </div>
                </div>

                <div class="product" onclick="toggleHighlight(this)">
                    <img src="images/correction tape.jpg">
                    <div class="product-info">
                        <h3>Correction Tape</h3>
                        <p class="price">NT$20</p>
                        <button onclick="event.stopPropagation(); addToCart('Correction Tape',20)">Add To Cart</button>
                    </div>
                </div>

                <div class="product" onclick="toggleHighlight(this)">
                    <img src="eraser.jpg">
                    <div class="product-info">
                        <h3>Eraser</h3>
                        <p class="price">NT$12</p>
                        <button onclick="event.stopPropagation(); addToCart('Eraser',12)">Add To Cart</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>🛒 Shopping Cart <span id="cartCounter" class="badge">0</span></h2>
            <div id="cartItems">Your cart is empty.</div>
            <h3 id="cartTotal" style="margin-top:15px; color:#0f172a;">Total: NT$0</h3>
        </div>

        <div class="card">
            <h2>Checkout</h2>
            <input id="checkoutName" placeholder="Full Name">
            <input id="checkoutEmail" type="email" placeholder="Email Address">
            <button onclick="checkout()">Submit Order</button>
        </div>

    </div>

    <div class="right-column">
        
        <div class="card">
            <h2>Account</h2>
            <div class="auth-vertical">
                <div class="auth-box">
                    <h3>Sign Up</h3>
                    <input type="email" id="signupEmail" placeholder="Email">
                    <input type="password" id="signupPassword" placeholder="Password">
                    <button onclick="signUp()" style="width:100%;">Sign Up</button>
                </div>

                <div class="auth-box" style="margin-top: 10px;">
                    <h3>Login</h3>
                    <input type="email" id="loginEmail" placeholder="Email">
                    <input type="password" id="loginPassword" placeholder="Password">
                    <button onclick="login()" style="width:100%;">Login</button>
                </div>
                
                <button onclick="logout()" style="background:#64748b; margin-top:10px;">Logout</button>
            </div>
        </div>

        <div class="card">
            <h2>My Order History</h2>
            <div id="orderHistory">Login to view orders.</div>
        </div>

    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, where, orderBy, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCJzCCtXqUocp3tJ8UA_5w-KRT4gknBvYA",
  authDomain: "onlinestore-c2dd9.firebaseapp.com",
  projectId: "onlinestore-c2dd9",
  storageBucket: "onlinestore-c2dd9.firebasestorage.app",
  messagingSenderId: "718751590576",
  appId: "1:718751590576:web:fc401df926d47f9760b375",
  measurementId: "G-DHDVQMRMNN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// EmailJS Config
const EMAILJS_PUBLIC_KEY = "idz2AOO5O0lVowKHc";
const EMAILJS_SERVICE_ID = "service_iayn6dg";
const EMAILJS_TEMPLATE_ID = "template_dobxi6s";

emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

let currentUser = null;
let cart = [];

// 🆕 功能 1：即時搜尋商品關鍵字
window.filterProducts = function() {
    const searchText = document.getElementById("searchInput").value.toLowerCase();
    const products = document.querySelectorAll("#productList .product");
    
    products.forEach(product => {
        const productName = product.querySelector("h3").innerText.toLowerCase();
        // 如果包含關鍵字就顯示，沒有就隱藏 (display: none)
        if (productName.includes(searchText)) {
            product.style.display = "block";
        } else {
            product.style.display = "none";
        }
    });
}

// 🆕 功能 2：點擊凸顯商品（點擊時加上藍框，再點一下或是點別的商品會清除舊的藍框）
window.toggleHighlight = function(element) {
    // 檢查點到的這個是不是本來就已經被凸顯了
    const wasHighlighted = element.classList.contains("highlighted");
    
    // 先把畫面上所有商品的凸顯效果都拔掉
    const allProducts = document.querySelectorAll("#productList .product");
    allProducts.forEach(product => {
        product.classList.remove("highlighted");
    });
    
    // 如果點到的本來沒被凸顯，那就幫它加上凸顯效果
    if (!wasHighlighted) {
        element.classList.add("highlighted");
    }
}

// 渲染購物車介面
window.updateCart = function() {
    const cartItemsDiv = document.getElementById("cartItems");
    const cartTotalH3 = document.getElementById("cartTotal");
    const cartCounterSpan = document.getElementById("cartCounter");
    
    if (cart.length === 0) {
        cartItemsDiv.innerHTML = "Your cart is empty.";
        cartTotalH3.innerText = "Total: NT$0";
        cartCounterSpan.innerText = "0";
        return;
    }
    
    let html = "";
    let total = 0;
    let totalItems = 0;
    
    cart.forEach((item, index) => {
        html += `
        <div class="cart-item">
            <span>${item.name} (NT$${item.price})</span>
            <div>
                <button class="counter-btn" onclick="changeQuantity(${index}, -1)">-</button>
                <span>${item.quantity}</span>
                <button class="counter-btn" onclick="changeQuantity(${index}, 1)">+</button>
                <span style="margin-left: 15px; font-weight: bold;">NT$${item.price * item.quantity}</span>
            </div>
        </div>`;
        total += item.price * item.quantity;
        totalItems += item.quantity;
    });
    
    cartItemsDiv.innerHTML = html;
    cartTotalH3.innerText = `Total: NT$${total}`;
    cartCounterSpan.innerText = totalItems;
}

window.changeQuantity = function(index, amount) {
    cart[index].quantity += amount;
    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }
    updateCart();
}

window.addToCart = function(name, price){
    const existing = cart.find(item => item.name === name);
    if(existing){
        existing.quantity++;
    }else{
        cart.push({ name, price, quantity: 1 });
    }
    updateCart();
}

// Sign Up
window.signUp = async () => {
    const email = document.getElementById("signupEmail").value;
    const password = document.getElementById("signupPassword").value;
    try{
        await createUserWithEmailAndPassword(auth, email, password);
        alert("Signup successful");
    }catch(error){
        alert(error.message);
    }
};

// Login
window.login = async () => {
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    try{
        await signInWithEmailAndPassword(auth, email, password);
        alert("Login successful");
    }catch(error){
        alert(error.message);
    }
};

// Logout
window.logout = async () => {
    await signOut(auth);
};

// Checkout 下單
window.checkout = async function(){
    if(!currentUser){
        alert("Please login first.");
        return;
    }
    if(cart.length===0){
        alert("Cart is empty.");
        return;
    }

    const customerName = document.getElementById("checkoutName").value;
    const customerEmail = document.getElementById("checkoutEmail").value;

    if(!customerName || !customerEmail) {
        alert("Please fill in name and email for checkout.");
        return;
    }

    let total = 0;
    cart.forEach(item=>{
        total += item.price * item.quantity;
    });

    try{
        await addDoc(collection(db,"orders"), {
            userId: currentUser.uid,
            userEmail: currentUser.email,
            customerName,
            customerEmail,
            items: cart,
            total,
            status:"Pending",
            orderDate: serverTimestamp()
        });

        const itemList = cart.map(item=> `${item.name} x${item.quantity}` ).join(", ");

        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
            customer_name: customerName,
            customer_email: customerEmail,
            items: itemList,
            total: total
        });

        alert("Order submitted successfully!");
        cart = [];
        updateCart();
        loadOrders();

        document.getElementById("checkoutName").value = "";
        document.getElementById("checkoutEmail").value = "";
    }catch(error){
        console.error(error);
        alert("Order failed. " + error.message);
    }
}

// Load Orders
async function loadOrders(){
    if(!currentUser){
        document.getElementById("orderHistory").innerHTML = "Login to view orders.";
        return;
    }

    try {
        const q = query(
            collection(db,"orders"),
            where("userId","==",currentUser.uid),
            orderBy("orderDate","desc")
        );

        const snapshot = await getDocs(q);
        let html = "";

        snapshot.forEach(doc=>{
            const o = doc.data();
            const itemDetails = (o.items || [])
                .map(item => `${item.name} x${item.quantity} (NT$${item.price})`)
                .join("<br>");

            html += `
            <div class="order-item">
                <strong>Items:</strong><br>${itemDetails}<br>
                <strong>Customer Name:</strong> ${o.customerName || 'N/A'}<br>
                <strong>Customer Email:</strong> ${o.customerEmail || 'N/A'}<br>
                <strong>Total Amount:</strong> NT$${o.total}<br>
                <strong>Status:</strong> ${o.status || 'Pending'}<br>
                <strong>Account Email:</strong> ${o.userEmail}
            </div>`;
        });

        document.getElementById("orderHistory").innerHTML = html || "No orders found.";
    } catch (error) {
        console.error("Error loading orders:", error);
        if (error.message && error.message.includes("FAILED_PRECONDITION")) {
            document.getElementById("orderHistory").innerHTML = `
                <div style="color: #0369a1; padding: 10px; border: 1px solid #bae6fd; background: #f0f2fe; border-radius: 8px; font-size:12px;">
                    <strong>⚠️ 資料庫索引尚未建立：</strong><br>
                    請按 F12 檢查 Console，點擊紅色錯誤訊息中的官方連結來自動建立 Firebase 索引（建立後需等 3 分鐘）。
                </div>`;
        } else {
            document.getElementById("orderHistory").innerHTML = "Error loading orders. Check console.";
        }
    }
}

// Auth Listener
onAuthStateChanged(auth,(user)=>{
    currentUser = user;
    if(user){
        document.getElementById("userInfo").innerText = `Logged in as: ${user.email}`;
        loadOrders();
    }else{
        document.getElementById("userInfo").innerText = "Not Logged In";
        document.getElementById("orderHistory").innerHTML = "Login to view orders.";
    }
});
</script>

</body>
</html>
