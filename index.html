# Onlineschooltoolstore
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#4f46e5;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-top:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

h2{
    margin-bottom:15px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.product{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.product img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.product-info{
    padding:15px;
}

.product-info h3{
    margin-bottom:10px;
}

.price{
    color:#4f46e5;
    font-weight:bold;
}

input,textarea,select{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    background:#4f46e5;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.auth-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.order-item{
    border-bottom:1px solid #ddd;
    padding:10px 0;
}

#userInfo{
    margin-top:10px;
    font-weight:bold;
}

@media(max-width:768px){
    .auth-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>🛍 My Online Store</h1>
    <div id="userInfo">Not Logged In</div>
</header>

<div class="container">

    <!-- Products -->
    <div class="card">
        <h2>Products</h2>

        <div class="products">

            <div class="product">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600" alt="">
                <div class="product-info">
                    <h3>Smart Watch</h3>
                    <p class="price">$99</p>
                </div>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" alt="">
                <div class="product-info">
                    <h3>Running Shoes</h3>
                    <p class="price">$120</p>
                </div>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600" alt="">
                <div class="product-info">
                    <h3>Headphones</h3>
                    <p class="price">$80</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Auth -->
    <div class="card">
        <h2>Account</h2>

        <div class="auth-grid">

            <div>
                <h3>Sign Up</h3>

                <input type="email" id="signupEmail" placeholder="Email">
                <input type="password" id="signupPassword" placeholder="Password">

                <button onclick="signUp()">Sign Up</button>
            </div>

            <div>
                <h3>Login</h3>

                <input type="email" id="loginEmail" placeholder="Email">
                <input type="password" id="loginPassword" placeholder="Password">

                <button onclick="login()">Login</button>
            </div>

        </div>

        <br>
        <button onclick="logout()">Logout</button>
    </div>

    <!-- Order Form -->
    <div class="card">
        <h2>Place Order</h2>

        <input id="customerName" placeholder="Customer Name">

        <select id="productName">
            <option>Smart Watch</option>
            <option>Running Shoes</option>
            <option>Headphones</option>
        </select>

        <input id="quantity" type="number" value="1">

        <input id="price" type="number" placeholder="Price">

        <textarea id="message" placeholder="Message"></textarea>

        <button onclick="placeOrder()">Place Order</button>
    </div>

    <!-- Order History -->
    <div class="card">
        <h2>My Order History</h2>

        <div id="orderHistory">
            Login to view orders.
        </div>
    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
where,
orderBy,
getDocs,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ==========================
// Replace with your config
// ==========================

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCJzCCtXqUocp3tJ8UA_5w-KRT4gknBvYA",
  authDomain: "onlinestore-c2dd9.firebaseapp.com",
  projectId: "onlinestore-c2dd9",
  storageBucket: "onlinestore-c2dd9.firebasestorage.app",
  messagingSenderId: "718751590576",
  appId: "1:718751590576:web:fc401df926d47f9760b375",
  measurementId: "G-DHDVQMRMNN"
};


// ==========================
// Sign Up
// ==========================

window.signUp = async () => {

    const email =
    document.getElementById("signupEmail").value;

    const password =
    document.getElementById("signupPassword").value;

    try{

        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

        alert("Signup successful");

    }catch(error){

        alert(error.message);

    }
};


// ==========================
// Login
// ==========================

window.login = async () => {

    const email =
    document.getElementById("loginEmail").value;

    const password =
    document.getElementById("loginPassword").value;

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        alert("Login successful");

    }catch(error){

        alert(error.message);

    }
};


// ==========================
// Logout
// ==========================

window.logout = async () => {

    await signOut(auth);

};


// ==========================
// Place Order
// ==========================

window.placeOrder = async () => {

    if(!currentUser){

        alert("Please login first.");
        return;

    }

    const customerName =
    document.getElementById("customerName").value;

    const productName =
    document.getElementById("productName").value;

    const quantity =
    Number(document.getElementById("quantity").value);

    const price =
    Number(document.getElementById("price").value);

    const message =
    document.getElementById("message").value;

    try{

        await addDoc(
            collection(db,"orders"),
            {

                userId: currentUser.uid,

                userEmail: currentUser.email,

                customerName,

                productName,

                quantity,

                price,

                message,

                orderDate: serverTimestamp()

            }
        );

        alert("Order placed!");

        loadOrders();

    }catch(error){

        alert(error.message);

    }
};


// ==========================
// Load Orders
// ==========================

async function loadOrders(){

    if(!currentUser){

        document.getElementById("orderHistory")
        .innerHTML =
        "Login to view orders.";

        return;
    }

    const q = query(
        collection(db,"orders"),
        where("userId","==",currentUser.uid),
        orderBy("orderDate","desc")
    );

    const snapshot =
    await getDocs(q);

    let html = "";

    snapshot.forEach(doc=>{

        const o = doc.data();

        html += `
        <div class="order-item">

            <strong>${o.productName}</strong><br>

            Customer:
            ${o.customerName}<br>

            Quantity:
            ${o.quantity}<br>

            Price:
            $${o.price}<br>

            Message:
            ${o.message}<br>

            Email:
            ${o.userEmail}

        </div>
        `;
    });

    if(html===""){
        html="No orders found.";
    }

    document.getElementById("orderHistory")
    .innerHTML = html;
}


// ==========================
// Auth Listener
// ==========================

onAuthStateChanged(auth,(user)=>{

    currentUser = user;

    if(user){

        document.getElementById("userInfo")
        .innerText =
        `Logged in as: ${user.email}`;

        loadOrders();

    }else{

        document.getElementById("userInfo")
        .innerText =
        "Not Logged In";

        document.getElementById("orderHistory")
        .innerHTML =
        "Login to view orders.";
    }

});

</script>

</body>
</html>
